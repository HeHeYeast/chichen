<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鸡宝厨房 · 图标对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#4a3a2c;font:15px "Microsoft YaHei",sans-serif}
main{width:min(940px,100%);margin:auto;padding:32px}
h1{font-size:24px;margin:0 0 8px}p{line-height:1.7;margin:0;color:#7b6a59}
.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
article{background:#fffdf8;border:1px solid #e4dccd;padding:22px 16px;text-align:center;border-radius:12px}
h2{font-size:15px;margin:0 0 18px;font-weight:600}
.icon{width:var(--size,144px);height:var(--size,144px);position:relative;overflow:hidden;margin:auto;background:#fff2d5;border-radius:24%}
.icon.circle{border-radius:50%}.icon.square{border-radius:0}
.icon img{display:block;width:150%;height:150%;max-width:none;position:absolute;left:-25%;top:-25%;object-fit:fill}
.icon.original img{width:100%;height:100%;left:0;top:0}
.icon svg{display:block;width:100%;height:100%}
small{display:block;font-size:12px;color:#897b6b;margin-top:14px}
.samples{display:flex;align-items:end;justify-content:center;gap:26px;padding:20px 0 4px}
.sample{text-align:center}.sample p{font-size:12px;margin-top:9px}
.detail{margin-top:24px;padding:20px 24px;background:#ebe4d7;border-radius:12px}
.detail h2{text-align:left;margin-bottom:0}.note{font-size:12px;margin-top:20px}
@media(max-width:640px){main{padding:20px}.comparison{gap:8px}.comparison article{padding:16px 6px}.comparison .icon{--size:90px}.samples{gap:16px;flex-wrap:wrap}}
</style></head>
<body><main>
<h1>沿用原版鸡宝，调整桌面图标</h1>
<p>保留探头姿势、小毛和张嘴表情，简化背景装饰。</p>
<section class="comparison" aria-label="图标对照">
<article><h2>原版</h2><div class="icon original"><img src="/assets/png/icon.png" alt="原版鸡宝厨房图标"></div><small>原始完整图标</small></article>
<article><h2>修改前</h2><div class="icon circle" id="previous"></div><small>旧图标 · 圆形裁切</small></article>
<article><h2>修改后</h2><div class="icon circle"><img src="/web/art/app-icon-v2.png" alt="新版圆形图标"></div><small>沿用原版角色特征</small></article>
</section>
<section class="detail"><h2>小尺寸与不同外形</h2>
<div class="samples">
<div class="sample"><div class="icon circle" style="--size:48px"><img src="/web/art/app-icon-v2.png" alt="48像素圆形"></div><p>48 · 圆形</p></div>
<div class="sample"><div class="icon" style="--size:48px"><img src="/web/art/app-icon-v2.png" alt="48像素圆角方形"></div><p>48 · 圆角</p></div>
<div class="sample"><div class="icon circle" style="--size:72px"><img src="/web/art/app-icon-v2.png" alt="72像素圆形"></div><p>72 · 圆形</p></div>
<div class="sample"><div class="icon" style="--size:72px"><img src="/web/art/app-icon-v2.png" alt="72像素圆角方形"></div><p>72 · 圆角</p></div>
<div class="sample"><div class="icon circle" style="--size:72px;background:#dce8d7" id="monochrome"></div><p>单色主题</p></div>
</div></section>
<p class="note">此页模拟图标外形与尺寸；手机桌面的最终遮罩由系统决定。原作素材保留，通知图标独立。</p>
</main>
<script type="module">
const previous = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"18 18 72 72\"><rect width=\"108\" height=\"108\" fill=\"#F7DC89\"/><path fill=\"#EB9560\" stroke=\"#65432B\" stroke-width=\"2.5\" d=\"M43,32 C38,20 46,18 51,28 C52,17 61,19 59,31 C65,23 72,29 64,36 Z\"/><path fill=\"#FFF4C5\" stroke=\"#65432B\" stroke-width=\"3\" stroke-linejoin=\"round\" d=\"M54,30 C35,29 25,43 27,62 C26,77 38,85 54,84 C72,86 85,76 82,61 C84,42 72,29 54,30 Z\"/><path fill=\"#FFD56A\" d=\"M28,61 C20,53 17,61 25,69 L33,70 Z M79,62 C89,52 92,61 84,69 L76,70 Z\"/><path fill=\"#65432B\" d=\"M43,48 A3.4,4.3 0,1 1,43,56.6 A3.4,4.3 0,1 1,43,48 Z M65,48 A3.4,4.3 0,1 1,65,56.6 A3.4,4.3 0,1 1,65,48 Z\"/><path fill=\"#ECA173\" d=\"M32,59 A5,3 0,1 1,42,59 A5,3 0,1 1,32,59 Z M67,59 A5,3 0,1 1,77,59 A5,3 0,1 1,67,59 Z\"/><path fill=\"#EAA24E\" stroke=\"#65432B\" stroke-width=\"1.7\" stroke-linejoin=\"round\" d=\"M48,57 L60,57 L54,64 Z\"/><path fill=\"none\" stroke=\"#65432B\" stroke-width=\"2.5\" stroke-linecap=\"round\" d=\"M43,83 L41,88 M42,87 L37,87 M66,83 L68,88 M67,87 L72,87\"/></svg>";
const mono = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"18 18 72 72\"><path fill=\"#40523d\" fill-rule=\"evenodd\" d=\"M55,33 C40,32 31,46 31,65 C25,60 23,64 28,72 L32,75 C35,83 44,85 55,85 C67,85 77,80 78,71 C85,67 87,60 83,59 L77,65 C77,47 68,34 55,33 Z M43,51 A3.3,4.1 0,1 1,43,59.2 A3.3,4.1 0,1 1,43,51 Z M64,51 A3.3,4.1 0,1 1,64,59.2 A3.3,4.1 0,1 1,64,51 Z M47,64 Q54,58 61,64 Q58,76 54,77 Q49,75 47,64 Z\"/><path fill=\"none\" stroke=\"#40523d\" stroke-width=\"2.8\" stroke-linecap=\"round\" d=\"M54,34 L56,24 M50,25 L60,22 M50,30 L61,28\"/></svg>";
document.querySelector('#previous').innerHTML=previous;
document.querySelector('#monochrome').innerHTML=mono;
await Promise.all([...document.images].map(im=>im.decode()));
document.body.dataset.ready='true';
</script>
</body></html>
