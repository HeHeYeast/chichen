<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸡宝厨房 · 全界面试玩</title><style>
*{box-sizing:border-box}body{margin:0;color:#57472e;background:#f1efe4;font:14px 'Microsoft YaHei','PingFang SC',sans-serif}main{max-width:1410px;margin:auto;padding:26px 20px 38px}header p{margin:7px 0;max-width:900px;line-height:1.8;color:#827357}h1{font-size:26px;margin:0 0 10px}a{color:#557746;text-underline-offset:3px}nav{display:flex;gap:16px;margin:14px 0 22px;flex-wrap:wrap}.pages{display:grid;grid-template-columns:repeat(4,minmax(0,320px));gap:24px;justify-content:center}.screen-card{min-width:0}.screen-card h2{margin:0 0 8px;font-size:17px}.screen-card p{margin:5px 0 12px;min-height:36px;color:#857355;font-size:12px;line-height:1.6}.screen-card iframe{display:block;width:100%;height:568px;border:0;background:#e3ebd6;border-radius:2px;box-shadow:0 3px 12px #59472515}select,button{font:inherit;font-size:12px;border:1px solid #bead8c;background:#fffbef;color:#5d4c30;border-radius:6px;min-height:34px;padding:6px 8px}.screen-options{display:flex;gap:7px;margin-top:10px}select{flex:1;min-width:0}button{cursor:pointer}button:hover{background:#ffe8a1}output{display:block;min-height:42px;white-space:pre-line;font-size:11px;line-height:1.7;color:#7e775c;margin:8px 0}.single{font-size:12px}footer{margin-top:25px;font-size:12px;color:#887c62;line-height:1.8}button:focus-visible,select:focus-visible{outline:2px solid #4d865f;outline-offset:2px}@media(max-width:1080px){.pages{grid-template-columns:repeat(2,minmax(0,320px))}}@media(max-width:700px){.pages{grid-template-columns:minmax(0,320px)}main{padding:22px 12px}}
</style></head><body><main><header><h1>鸡宝的小世界</h1><p>新增图鉴配方册，按九类厨具和特殊变化分类；首次收取伙伴后解锁配方。农场可以全选售卖，或每个品种留一只。</p><p>16 位四时伙伴可在符合材料搭配的调理中偶遇，收录后可从配方册定向准备。节日伙伴恢复日期限制，日历提前 7 天预告；凤凰窗口提前一小时给游戏内预告。</p><p>这里使用独立演示进度，不会修改正常游戏。可以放心试买、试卖，再恢复这一栏。</p><nav><a href="/review?scene=v14-recipes&amp;v=14">图鉴配方册 ↗</a><a href="/review?scene=v14-harvest&amp;v=14">批量售卖 ↗</a><a href="/review?scene=title&amp;v=13">新版封面 ↗</a><a href="/">正常游戏 ↗</a><a href="/web/stage-review.html?v=7">四级厨房</a><a href="/review">单屏试玩与尺寸检查</a></nav></header><section class="pages"></section><footer>农场保留昼夜变化和横向探索。商品价格、库存、解锁、出售与图鉴记录均使用游戏规则；原始角色编号及正常存档保持兼容。</footer></main><script type="module">
const pages=[
 {title:'农场',description:'全选售卖或每种留一只，保留在农场。',scene:'v14-harvest',options:[['v14-harvest','全选与每种留一只'],['v12-calendar','寻宝日历'],['v12-preview','窗口提前预告'],['v12-recipes','16 位四时新伙伴'],['v12-rewards','章节集章回礼'],['v12-farm','新伙伴农场'],['v11-draw','神社求签'],['v11-held','已领御神签'],['v11-busy','已有一批孵化中'],['v11-book','十五格签册'],['v11-goals','八项收藏回礼'],['v11-new','新玩家的神社目标'],['v11-farm','农场神社快捷入口'],['v10-activities','神社伙伴来信'],['v10-activities-locked','新玩家的委托目标'],['v10-gifts','神社签礼领取'],['v10-gifts-full','赠品库存已满'],['v10-travel','时空旅行'],['v10-farm-shrine','农场神社入口'],['v8-farm','白天农场'],['v9-dim-sum-farm','点心鸡宝新伙伴'],['v8-farm-dawn','清晨农场'],['v8-farm-evening','黄昏农场'],['v8-farm-night','夜晚农场'],['v8-harvest','收成买卖'],['v8-empty-farm','空农场'],['v8-farm-damaged','需要整修']]},
 {title:'图鉴',description:'按厨具分类的配方册，只展示已收录伙伴。',scene:'v14-recipes',options:[['v14-recipes','按厨具查配方'],['v14-steamer','竹蒸笼六味点心'],['v14-detail','鸭宝配方与缺料'],['v14-species','从档案查看配方'],['v14-new','尚未解锁配方'],['v14-unknown','未知伙伴隐藏配方'],['v14-calendar','四时收集手记'],['v12-collection','新增鸭宝图鉴'],['v12-detail','手作配方详情'],['v10-collection','未发现伙伴的线索'],['v8-collection','鸡宝收藏册'],['v9-dim-sum-detail','点心鸡宝档案'],['v8-detail','鸡宝详情与单只出售'],['v8-empty-collection','尚未发现']]},
 {title:'商店',description:'75 种调味料、三级厨具外观与鸭蛋开放。',scene:'v10-catalog',options:[['v10-catalog','完整调味料目录'],['v10-catalog-locked','新玩家待解锁目录'],['v10-duck','鸭蛋与常驻委托入口'],['v8-shop','厨具货架'],['v9-dim-sum-shop','竹蒸笼与原料'],['v9-dim-sum','点心鸡宝收取'],['v8-shop-ingredients','调味料货架'],['v8-shop-poor','CP 不足'],['v8-full-inventory','调味料库存已满']]},
 {title:'设置',description:'调好声音，继续照顾小厨房。',scene:'v11-settings',options:[['v11-settings','设置与滚动'],['v11-ingredients','材料选择与满槽提示'],['v8-settings','声音与进度'],['v8-manual','鸡宝照顾手册']]}
];
const cards=pages.map(page=>{const card=document.createElement('article');card.className='screen-card';card.innerHTML=`<h2>${page.title}</h2><p>${page.description}</p><iframe src="/?review=1" title="${page.title}试玩"></iframe><div class="screen-options"><select aria-label="${page.title}展示场景">${page.options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select><button disabled>恢复</button></div><output>正在载入…</output><a class="single" href="/review?scene=${page.scene}">单独试玩 ↗</a>`;document.querySelector('.pages').append(card);const entry={...page,card,frame:card.querySelector('iframe'),ready:false};const reset=()=>{if(entry.ready)entry.frame.contentWindow.postMessage({type:'chick-review',command:'scene',value:card.querySelector('select').value},location.origin);};card.querySelector('button').onclick=reset;card.querySelector('select').onchange=()=>{reset();card.querySelector('a').href='/review?scene='+card.querySelector('select').value;};entry.reset=reset;return entry;});
function sizeFrames(){cards.forEach(card=>{card.frame.style.height=card.frame.clientWidth*568/320+'px';});}window.addEventListener('resize',sizeFrames);sizeFrames();
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='chick-status'||!event.data.loaded)return;const card=cards.find(card=>card.frame.contentWindow===event.source);if(!card)return;if(!card.ready){card.ready=true;card.card.querySelector('button').disabled=false;card.reset();return;}card.card.querySelector('output').textContent=`${event.data.cp.toLocaleString('zh-CN')} CP · 厨房 Lv.${event.data.kitchenLevel}\n可直接操作 · 恢复按钮会重置演示进度`;});
</script></body></html>
