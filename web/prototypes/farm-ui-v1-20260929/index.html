<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicken Kitchen · Farm UI V1</title>
  <style>
    @font-face{font-family:JourneyRounded;src:url('../../fonts/journey-rounded-heavy.woff2') format('woff2');font-weight:900;font-display:block}
    :root{--ink:#633d27;--ink-soft:#876145;--cream:#fff6db;--cream-deep:#f5dfad;--gold:#f8d778;--orange:#e9a45e;--leaf:#83ac66}
    *{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden}body{font-family:JourneyRounded,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);background:#c6d891;-webkit-font-smoothing:antialiased}
    .screen{position:relative;width:390px;height:844px;overflow:hidden;isolation:isolate}
    .map-viewport{position:absolute;inset:97px 0 77px;overflow:hidden;background:#91bd6b}
    .map-image{position:absolute;left:-192px;top:-4px;width:1075.2px;height:716.8px;max-width:none;user-select:none;pointer-events:none}
    .map-viewport:before{content:"";position:absolute;z-index:1;inset:0 0 auto;height:21px;background:linear-gradient(#fff4d4a8,transparent);pointer-events:none}
    .map-viewport:after{content:"";position:absolute;z-index:1;inset:auto 0 0;height:24px;background:linear-gradient(transparent,#65552b18);pointer-events:none}
    .icon{display:block;flex:none;width:32px;height:32px;overflow:visible;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .hud{position:absolute;z-index:5;left:0;top:0;width:390px;height:100px;background:linear-gradient(180deg,#fff8e6 0%,#fff2d1 100%);border-bottom:3px solid #9e764e;box-shadow:0 3px 0 #f4d682,0 5px 8px #54351824}
    .hud:after{content:"";position:absolute;bottom:3px;left:0;right:0;border-bottom:1px solid #ead3a0}
    .avatar{position:absolute;left:11px;top:9px;width:55px;height:56px;border:2.5px solid var(--ink);border-radius:17px;background:linear-gradient(#ffe4a0,#f6c971);box-shadow:inset 0 2px #fff6cf,0 2px #9c6c4080;display:grid;place-items:center}
    .avatar .icon{width:45px;height:45px;stroke-width:2.2}
    .level{position:absolute;left:16px;top:58px;min-width:46px;height:20px;border:2px solid #8f5a34;border-radius:7px;background:#754327;color:#fff1c7;text-align:center;font-size:11px;font-weight:900;line-height:16px;letter-spacing:.2px;box-shadow:0 2px #d7a761}
    .wallet{position:absolute;left:72px;top:17px;height:40px;width:103px;display:flex;align-items:center;gap:4px;padding:3px 9px 3px 4px;border:2px solid #9a6a45;border-radius:22px;background:#fff8e8;box-shadow:inset 0 2px #fff,0 2px #debd81}
    .wallet .icon{width:31px;height:31px;stroke-width:2}
    .wallet strong{font-size:18px;font-weight:900;letter-spacing:.4px;line-height:1}
    .title{position:absolute;top:13px;left:176px;width:86px;height:48px;display:flex;justify-content:center;align-items:center;gap:1px;font-size:27px;line-height:1;font-weight:1000;letter-spacing:1px;text-shadow:0 2px #ffe3a8}
    .title .icon{width:17px;height:23px;align-self:flex-end;margin-bottom:8px;stroke-width:2}
    .settings{position:absolute;right:11px;top:17px;width:40px;height:40px;display:grid;place-items:center;border:2px solid #956443;border-radius:14px;background:linear-gradient(#fff8e6,#f7dfa9);box-shadow:0 2px #c69659,inset 0 1px #fff}
    .settings .icon{width:27px;height:27px;stroke-width:2}
    .home-status,.repair-status{position:absolute;top:68px;height:22px;display:flex;align-items:center;gap:5px;font-size:12px;line-height:20px;font-weight:800;white-space:nowrap}
    .home-status{left:77px}.home-status .icon{width:20px;height:20px;stroke-width:2}
    .repair-status{right:14px;color:#76513a}.repair-status .icon{width:20px;height:20px;stroke-width:2}
    .repair-status b{font-size:13px;color:#a95c34}
    .place{position:absolute;z-index:2;display:flex;align-items:center;gap:5px;width:120px;height:46px;padding:4px 9px 4px 6px;border:2.2px solid var(--ink);border-radius:16px;background:linear-gradient(#fff9e7,#f8e9c4);box-shadow:0 4px 0 #9d714899,0 5px 10px #3b452b36;white-space:nowrap}
    .place:after{content:"";position:absolute;width:10px;height:10px;left:16px;bottom:-7px;background:#f8e9c4;border-right:2.2px solid var(--ink);border-bottom:2.2px solid var(--ink);transform:rotate(45deg)}
    .place .icon{width:30px;height:30px;stroke-width:2.3}
    .place-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.04}.place strong{font-size:15px;font-weight:1000}.place small{margin-top:4px;font-size:9px;font-weight:800;color:#8b6045}
    .place.house{left:160px;top:192px}.place.stand{left:108px;top:468px}
    .map-controls{position:absolute;z-index:3;right:16px;bottom:99px;display:flex;flex-direction:column;align-items:center;gap:5px}
    .zoom{width:42px;height:79px;display:flex;flex-direction:column;border:2.5px solid var(--ink);border-radius:17px;overflow:hidden;background:#fff8e5;box-shadow:0 3px 0 #9b704c,0 5px 9px #2d4b2545}
    .zoom span{flex:1;display:grid;place-items:center;color:var(--ink);font-size:24px;font-weight:700;line-height:1}.zoom span+span{border-top:1.5px solid #e4c79d}
    .recenter{width:42px;height:42px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:15px;background:#fff8e5;box-shadow:0 3px 0 #9b704c,0 5px 9px #2d4b2545}.recenter .icon{width:25px;height:25px;stroke-width:2.4}
    .task{position:absolute;z-index:4;left:16px;bottom:99px;width:300px;height:56px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 8px;border:2px solid #8f6241;border-radius:19px;background:linear-gradient(#fff9e8,#fff0cf);box-shadow:0 4px 0 #b38050,0 6px 13px #344c2d52}
    .task-icon{height:39px;width:39px;display:grid;place-items:center;flex:none;border:2px solid #b77a45;border-radius:13px;background:linear-gradient(#ffe49d,#f6c57a);box-shadow:inset 0 1px #fff2ca}.task-icon .icon{width:29px;height:29px;stroke-width:2.1}
    .task-copy{display:flex;flex-direction:column;gap:2px;min-width:0}.task-copy b{font-size:10px;line-height:1;color:#ac6a37;font-weight:1000;letter-spacing:.8px}.task-copy strong{font-size:11.3px;line-height:1.15;font-weight:900;white-space:nowrap;letter-spacing:-.2px}.task-arrow{margin-left:auto;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#e7aa62;color:#fff9e4;font-size:16px;font-weight:900;line-height:1;flex:none}
    .nav{position:absolute;z-index:6;left:0;right:0;bottom:0;height:79px;display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#fff9e9 0%,#fff2d5 82%,#eed8ad 100%);border-top:3px solid #866043;box-shadow:0 -3px 0 #f1d78d,0 -5px 12px #4d612a40}
    .nav:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#d5ac78}
    .tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#80583d;font-size:11px;line-height:13px;font-weight:900;text-shadow:0 1px #fff;z-index:1}
    .tab .icon{width:36px;height:36px;stroke-width:2.2;filter:drop-shadow(0 1px 0 #fff0cc)}
    .tab.selected{color:#633721;font-size:12px}.tab.selected:before{content:"";position:absolute;z-index:-1;left:5px;right:5px;top:4px;bottom:5px;border:2px solid #d5a25e;border-radius:17px;background:linear-gradient(#ffe3a0,#fbd690);box-shadow:inset 0 1px #fff3cc,0 2px 5px #b6824f33}
    .tab.selected .icon{width:38px;height:38px}
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="chick" viewBox="0 0 48 48"><path d="M8 26c0-12 9-21 20-21s18 9 18 21c0 11-8 18-19 18S8 37 8 26Z" fill="#ffe49a"/><path d="M10 32c-4-1-6-5-4-9 2-3 5-3 7-1" fill="#ffe49a"/><path d="M18 15c-2-3-1-6 2-8m8 5c0-4 2-6 5-7"/><path d="M35 26c4-2 7-1 9 2-2 3-5 5-9 4Z" fill="#f2a466"/><circle cx="22" cy="25" r="1.8" fill="#633d27" stroke="none"/><circle cx="32" cy="24" r="1.8" fill="#633d27" stroke="none"/><path d="M26 30q2 2 4 0"/><circle cx="17" cy="30" r="3" fill="#edaa8b" stroke="none" opacity=".7"/></symbol>
  <symbol id="coin" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="#e7a744"/><circle cx="18" cy="17" r="12.3" fill="#ffdf79"/><path d="M22 12c-2-2-8-2-9 3-2 5 2 9 7 8 1 0 2-.4 3-1" stroke-width="3"/></symbol>
  <symbol id="gear" viewBox="0 0 36 36"><path d="M14 3h8l1 4 4 2 4-1 4 7-3 3 0 4 3 3-4 7-4-2-4 2-1 4h-8l-1-4-4-2-4 2-4-7 3-3v-4l-3-3 4-7 4 1 4-2Z" fill="#e9ba75"/><circle cx="18" cy="19" r="6" fill="#fff7dc"/></symbol>
  <symbol id="sprout" viewBox="0 0 32 32"><path d="M17 27V14"/><path d="M17 18C5 20 3 13 4 7c7-1 13 2 13 11Z" fill="#8eb66d"/><path d="M17 16c-1-8 3-12 11-11 0 7-3 12-11 11Z" fill="#a1c97d"/></symbol>
  <symbol id="home" viewBox="0 0 40 40"><path d="M4 19 19 5l17 13-3 3v14H7V21Z" fill="#f7daa0"/><path d="M4 19 19 5l17 13-3 4-14-11L7 23Z" fill="#d76643"/><path d="M7 22h26v13H7Z" fill="#fff0ca"/><path d="M17 35V23h9v12" fill="#9a6543"/><path d="M9 25h5v5H9Z" fill="#a5d1ca"/></symbol>
  <symbol id="basket" viewBox="0 0 40 40"><path d="M5 16h30l-3 19H8Z" fill="#dcab68"/><path d="M12 16c0-9 4-12 8-12s8 3 8 12"/><path d="M5 22h30M14 20l2 13m10-13-2 13"/><path d="M12 28h16"/></symbol>
  <symbol id="quest" viewBox="0 0 40 40"><path d="M10 4h20v29H10Z" fill="#fff4d2"/><path d="M10 4c-5-1-6 6-2 8h3M30 4c5-1 6 6 2 8h-3M10 33c-5-2-6 5-2 5h24c4 0 4-7-2-5" fill="#edbf7a"/><path d="M16 14h9m-9 6h10m-10 6h6"/><path d="m25 25 3 3 5-6" stroke="#86a460"/></symbol>
  <symbol id="target" viewBox="0 0 36 36"><circle cx="18" cy="18" r="11" fill="#fff8e1"/><circle cx="18" cy="18" r="4" fill="#dbac69"/><path d="M18 2v8m0 16v8M2 18h8m16 0h8"/></symbol>
  <symbol id="chef" viewBox="0 0 40 40"><path d="M10 28C2 28 1 18 7 15c-1-8 7-12 13-8 6-5 15 0 13 8 8 5 4 14-3 13v9H10Z" fill="#fff9e8"/><path d="M10 28h20M15 30v5m10-5v5"/><circle cx="20" cy="32" r="2" fill="#f6c769" stroke="none"/></symbol>
  <symbol id="farm" viewBox="0 0 40 40"><path d="M12 31C3 28 3 15 10 13c-1-7 8-10 12-5 8-2 14 4 12 11 5 7 0 14-9 14Z" fill="#ffe192"/><path d="M13 31c-7 2-10 0-11-5 5-4 10-3 13 2m11 4c7 3 11 0 11-5-4-4-10-3-13 2" fill="#8fba71"/><circle cx="15" cy="21" r="1.6" fill="#633d27" stroke="none"/><circle cx="25" cy="21" r="1.6" fill="#633d27" stroke="none"/><path d="m18 25 2 2 2-2" fill="#e89d59"/></symbol>
  <symbol id="shop" viewBox="0 0 40 40"><path d="M6 17h28v19H6Z" fill="#fff0cf"/><path d="M4 16 8 5h24l4 11Z" fill="#e99364"/><path d="M8 5h6l-2 11H4Zm12 0h6l2 11h-8Z" fill="#fff5d4"/><path d="M4 16c0 5 6 6 8 1 2 5 8 5 8 0 2 5 8 5 8 0 2 5 8 4 8-1"/><path d="M12 36V24h16v12" fill="#e7b472"/></symbol>
  <symbol id="explore" viewBox="0 0 40 40"><path d="m4 11 10-5 12 5 10-5v25l-10 5-12-5-10 5Z" fill="#d3e1ad"/><path d="M14 6v25m12-20v25"/><path d="M27 9c7 0 10 8 6 13l-6 7-7-8c-4-6 0-12 7-12Z" fill="#e99d67"/><circle cx="27" cy="16" r="2.5" fill="#fff3d5"/></symbol>
  <symbol id="book" viewBox="0 0 40 40"><path d="M5 7c7-3 12-2 15 2 3-4 8-5 15-2v27c-7-3-12-2-15 2-3-4-8-5-15-2Z" fill="#efbf80"/><path d="M20 9v27M9 14c3-1 6-1 8 0m-8 6c3-1 6-1 8 0m6-6c3-1 6-1 8 0m-8 6c3-1 6-1 8 0"/><circle cx="20" cy="27" r="5" fill="#ffe3a4"/></symbol>
</defs></svg>
<main class="screen" aria-label="Chicken Kitchen 农场页面视觉设计">
  <div class="map-viewport"><img class="map-image" src="../../art/farm/camp-map.png" alt="正式农场地图，河流环绕的营地"></div>
  <header class="hud">
    <div class="avatar"><svg class="icon"><use href="#chick"/></svg></div><span class="level">Lv.1</span>
    <div class="wallet"><svg class="icon"><use href="#coin"/></svg><strong>600</strong></div>
    <div class="title">农场<svg class="icon"><use href="#sprout"/></svg></div>
    <div class="settings" aria-label="设置"><svg class="icon"><use href="#gear"/></svg></div>
    <div class="home-status"><svg class="icon"><use href="#chick"/></svg><span>在家 <b>0</b> 位</span></div>
    <div class="repair-status"><svg class="icon"><use href="#sprout"/></svg><span>整修 <b>59%</b></span></div>
  </header>
  <div class="place house"><svg class="icon"><use href="#home"/></svg><span class="place-text"><strong>仓库</strong><small>收取与存放</small></span></div>
  <div class="place stand"><svg class="icon"><use href="#basket"/></svg><span class="place-text"><strong>陈列亭</strong><small>展示收藏</small></span></div>
  <div class="map-controls"><div class="zoom"><span>+</span><span>−</span></div><div class="recenter" aria-label="归位"><svg class="icon"><use href="#target"/></svg></div></div>
  <div class="task"><span class="task-icon"><svg class="icon"><use href="#quest"/></svg></span><span class="task-copy"><b>当前任务 · 前往厨房</b><strong>迎接第一位鸡宝</strong></span><span class="task-arrow">›</span></div>
  <nav class="nav" aria-label="主导航">
    <div class="tab"><svg class="icon"><use href="#chef"/></svg><span>厨房</span></div>
    <div class="tab selected"><svg class="icon"><use href="#farm"/></svg><span>农场</span></div>
    <div class="tab"><svg class="icon"><use href="#shop"/></svg><span>生意</span></div>
    <div class="tab"><svg class="icon"><use href="#explore"/></svg><span>寻访</span></div>
    <div class="tab"><svg class="icon"><use href="#book"/></svg><span>图鉴</span></div>
  </nav>
</main>
</body>
</html>
