function shell(title,content,foot,nav=0){return `<div class="hud"><div class="level">${chick()}<b>Lv.1</b></div><div class="balance"><span class="coin">C</span>1,280</div><button class="gear" data-action="help" aria-label="查看演示说明">⚙</button></div><section class="game-sheet"><div class="sheet-head"><div><button class="small-icon" data-action="return" aria-label="返回进入来源">‹</button><h2>${title}</h2></div><button class="small-icon" data-action="help" aria-label="本页说明">?</button></div><div class="scroll">${content}</div><div class="foot">${foot}</div></section><nav class="bottom-nav" aria-label="游戏主导航">${['厨房','农场','图鉴','商店'].map((n,i)=>`<div class="${i===nav?'active':''}">${icon(i)}${n}</div>`).join('')}</nav>`}
const badge=(s)=>`<span class="badge ${s==='已学习'?'':s==='可学习'?'gold':'gray'}">${s}</span>`;
function skillView(){const cards=skills[branch].map(x=>{const [id,n,t,c,m,state]=x,isPlan=planned.has(id);return `<article class="skill ${state==='已学习'?'learned':''}"><div class="skill-icon">${glyphs[branch]}</div><div><h3>${n}${badge(isPlan?'已加入':state)}</h3><p>${t}</p><div class="meta"><button class="text-button" data-skill="${id}">查看详情</button>${state==='已学习'?'<span>✓ 生效中</span>':state==='尚未解锁'?'<span>条件未齐</span>':`<button class="mini" data-plan="${id}" ${!isPlan&&c>points?'disabled':''}>${isPlan?'移出方案':c+'点加入'}</button>`}</div></div></article>`}).join('');return shell('厨房手艺',`<div class="points"><strong>${points}</strong><span>点可用<br><small>已学2项</small></span><div class="next">已发现12 / 193种<br>再发现3种，获得1点</div></div><div class="book-tabs" role="group" aria-label="手艺方向">${branches.map((x,i)=>`<button data-branch="${i}" aria-pressed="${branch===i}"><i aria-hidden="true">${glyphs[i]}</i>${x}</button>`).join('')}</div><div class="section-line"><b>${['收取与开火','照料与回访','出售与备货','线索与发现','材料与旅程'][branch]}</b><button class="text-button" data-action="points">点数来源</button></div>${cards}<div class="callout">专精只选一个，普通手艺可以跨方向组合。<br>完整方案包含30项；此页演示部分节点与状态。</div>`,`<div><p>${planned.size?'试配中 · 尚未生效':'先加入方案，再统一应用'}</p><strong>${planned.size?'已选 '+planned.size+' 项 · 花费 '+(4-points)+' 点':'找到自己的拿手活'}</strong></div><button class="primary" data-action="apply" ${planned.size?'':'disabled'}>应用方案</button>`)}
function tripView(){return shell('寻访小队',`<div class="route-hero"><span class="badge">庭院 · 2小时</span><h3>菜园围篱</h3><p>免费出发 · 到时自动归队</p><div class="scene" aria-hidden="true"></div></div><div class="route-choices"><button aria-pressed="true" data-action="yard">菜园围篱<small>1份起 · 2小时</small></button><button data-action="route">溪岸小径<small>2份起 · 6小时</small></button><button data-action="route">林间茶坡<small>3份起 · 10小时</small></button></div><div class="section-line"><b>同行伙伴 · 3 / 3</b><button class="text-button" data-action="team-help">选人规则</button></div><div class="team">${[selectedPartner?4:0,3,8].map((id,i)=>`<button class="member" data-member="${i}"><div class="art">${chick(id)}</div><strong>${[selectedPartner?'荷包蛋鸡':'鸡宝','香煎鸡','水煮蛋鸡'][i]}</strong><small>✓ 适应庭院</small></button>`).join('')}</div><p class="team-note">采集 ${selectedPartner?'9':'10'} · 发现 ${selectedPartner?'9':'8'}　｜　每种派出1只，家里都能留1只</p><div class="reward-box"><h3>这一趟的收获</h3><div class="reward-line"><span>保证材料</span><strong>1份</strong></div><div class="reward-line"><span>再带回1份的概率</span><strong>${selectedPartner?'39.5':'42'}%</strong></div><div class="meter"><span style="width:${selectedPartner?'39.5':'42'}%"></span></div><div class="reward-line"><span>带回1条新线索的概率</span><strong>${selectedPartner?'37':'35'}%</strong></div><div class="note">示例：有合格线索 · 无寻访手艺加成<br>连续未发现 2 / 7趟，第8趟必得新线索</div></div><div class="material-strip"><b>可能带回</b><span>食盐土 · 柠檬 · 照烧酱</span></div>`,`<div><p>预计22:40归队 · 示例时间</p><strong>3位同行 · 免费</strong></div><button class="primary" data-action="depart">出发 · 2小时</button>`)}
function cookView(){return shell('准备这一批',`<div class="recipe-head"><div class="art">${pan()}</div><div><h3>平底锅 · 鸡蛋</h3><p>不放调味料 <button class="text-button" data-action="ingredients">更换</button></p></div></div><div class="stats"><div><small>本批用时</small><strong>13分30秒</strong></div><div><small>开火费用</small><strong>90<span>CP</span></strong></div><div><small>破壳后保鲜</small><strong>${fresh?"2.5":"0.5"}<span>小时</span></strong></div></div><p class="tiny-note">✓ 火候熟练：15分 → 13分30秒<br>${fresh?"✓ 温暖餐罩：2小时 → 2.5小时":"延长保鲜已关闭：按原规则30分钟"}</p><div class="section-line"><b>本批可能出现</b><span>每批24枚 · 数量不固定</span></div><button class="candidate" data-action="known"><div class="art">${chick(3)}</div><div><strong>香煎鸡</strong><p>已收录 · 基础售价4 CP</p></div><span class="badge">可能出现</span></button><button class="candidate" data-action="observation"><span class="mystery">?</span><div><strong>C005</strong><p>尚未收录 · 点开观察</p></div><span class="badge gold">可能出现</span></button><div class="callout">候选是这套搭配可能出现的伙伴，<br>并不是已经抽到的结果。</div><label class="inline-choice"><input type="checkbox" data-fresh ${fresh?"checked":""}>延长保鲜 <button type="button" class="text-button" data-action="fresh">效果说明</button></label><button class="text-button" data-action="special">查看特殊变化与照料规则 ›</button>`,`<div><p>24枚鸡蛋 · 保留当前材料</p><strong>本次花费 90 CP</strong></div><button class="primary" data-action="cook">开始调理</button>`)}
function observationView(){return shell('风味观察',`<button class="text-button" data-action="back-cook">‹ 返回本批候选</button><div class="knowledge-hero"><span class="mystery">?</span><div><small>C005 · 尚未收录</small><h3>还未认识的味道</h3><span class="badge">基础线索已知</span></div></div><p class="quote">“一轮小太阳卧在白云上，<br>边缘卷起了金色的花边。”</p><div class="section-line"><b>已经知道</b><span>此处演示已学风味辨识</span></div><div class="fact"><i>✓</i><div>鸡蛋 · 平底锅 Lv.1 起<small>厨具条件已满足</small></div></div><div class="fact"><i>✓</i><div>全年都能尝试<small>不受节日日期限制</small></div></div><div class="fact lock"><i>?</i><div>材料还没有记全<small>继续发现伙伴，或学习「辨味笔记」</small></div></div><div class="section-line"><b>下一步</b></div><p class="tiny-note">这套搭配已能尝试；开火不保证出现。<br>实际收取后，名称、画像和配方会一起记入图鉴。</p><div class="callout">想直接查完整方法？学习「配方研读」后，可以花100 CP研读本编号。</div>`,`<button class="secondary" data-action="study">查看研读条件</button><button class="primary" data-action="back-cook">回到开火预览</button>`,2)}
function orderView(){return shell('小厨房的生意',`<div class="order-banner"><span>✉ 杂货铺掌柜的采购</span><span>没有截止日期</span></div><article class="order-card"><div class="order-top"><div class="art">${chick()}</div><div><small>第1章 · 已接取</small><h3>第一笔生意</h3><span class="badge gold">鸡宝 × 12只</span></div></div><div class="progress-label"><span>已交付4 / 12</span><span>还差8只</span></div><div class="progress"><span></span></div><div class="money-row"><span>每只货款</span><b>3 CP</b></div><div class="money-row emphasis"><span>全部交齐，另得</span><b>120 CP</b></div></article><div class="section-line"><b>这次交多少？</b><span>在家可用6只</span></div><div class="qty"><span>本次交付</span><button data-qty="-1" aria-label="减少交付数量">−</button><output>${qty}</output><button data-qty="1" aria-label="增加交付数量">+</button></div><p class="tiny-note">本次货款 ${qty*3} CP · 交付后进度 ${4+qty}/12<br>再交 ${8-qty} 只，可领取额外120 CP。</p><div class="callout">${qty===6?'这次会交出家里最后的6只。图鉴记录会保留。':'可以分批交付。已交出去的伙伴不能取回。'}</div><div class="list-slim"><div>下一笔 · 一份有茶香的采购<small>完成当前生意后查看</small></div><span>›</span></div>`,`<div><p>本次交付 ${qty} 只</p><strong>获得 ${qty*3} CP</strong></div><button class="primary" data-action="deliver">交付 ${qty} 只</button>`)}
function saleView(){return shell('确认这笔收成',`<div class="order-banner"><span>招牌类别 · 家常</span><span>售价 +12%</span></div><div class="candidate"><div class="art">${chick()}</div><div><strong>鸡宝 × 24只</strong><p>在家25只 · 出售后留1只</p></div><span class="badge">整筐</span></div><div class="bill"><div class="row"><span>基础货款</span><b>72 CP</b></div><div class="row bonus"><span>招牌加价 · 12%</span><b>+8 CP</b></div><div class="row bonus"><span>整筐奖励 · ${useBonus?"使用1次":"不使用"}</span><b>+${useBonus?12:0} CP</b></div><div class="row total"><span>本次到账</span><b>${useBonus?92:80} <small>CP</small></b></div><small>本次0.64 CP加价暂存，攒满1 CP自动到账。<br>此例加价累计余额为0；收取奖励此前已到账。</small></div><div class="reward-box"><h3>经营奖励</h3><div class="reward-line"><span>出售后剩余</span><strong>${useBonus?1:2} / 3次</strong></div><p class="tiny-note">再收取7只，增加1次。</p></div><label class="inline-choice"><input type="checkbox" data-bonus ${useBonus?"checked":""}>使用经营奖励</label><div class="callout">只出售在家可用的伙伴；已发现的图鉴和累计收取记录都会保留。</div>`,`<button class="secondary" data-action="sale-back">返回调整</button><button class="primary" data-action="sell">确认出售 · ${useBonus?92:80} CP</button>`,1)}
const renderers=[skillView,tripView,cookView,observationView,orderView,saleView];
const notes=[['从长表，变成可比较的本领。','把“什么效果、花几点、能不能学”放在同一张卡。点数来源移出主阅读区，去掉A/B/C编号和多级百分比。','试一试','点击「查看详情」「2点加入」，再应用方案。切换其他分支可以比较不同玩法；这是部分节点的交互样稿。','规则同步','当前→学习后、锁定条件与生效时点都要由实际规则生成。'],['先看小队，再看这趟值不值得。','三位头像、环境适应与实际收益放在一个连续区域。长下拉框换成伙伴抽屉，点击队员就能比较替换。','试一试','点击第一位队员，查看采集／发现属性和更换后的概率变化。此例为有可探索线索的情况。','数据口径','42%是额外1份材料的概率；35%是新线索概率，保证1份不受人数影响。'],['开火前只确认真正重要的事。','把用时、费用、保鲜排列成三个数值；候选展示独立的状态标签。效果来自已学手艺，不让玩家心算。','试一试','点击未知候选进入观察，再返回本批预览；配料和批次操作仍在原处。','保留边界','不把“可能出现”画成“本批已经拥有”。覆盖未收批次需要单独危险确认。'],['读完线索，知道下一步去哪。','趣味文字保留，但不再独自承担规则。已知事实、未知内容和下一步分层排列，观察页不带错误的寻访选中标签。','试一试','查看研读条件，再回到开火。名称与完整形象仍保密；知道方法不等于已收录。','分层原则','按实际知识展示，本页为已学基础观察的状态演示；正式页面要列真实缺项。'],['让出品和回报成为主角。','订单从章节文章改为采购单：头像、数量、进度、普通货款、交齐酬谢。故事依然保留，但交易不用先读长段叙事。','试一试','增减交付数量，检查本次货款与剩余进度；最后一只提示出现于提交之前。','信息节奏','当前只突出一笔单，下一章收起；不新增每日接单或倒计时压力。'],['每一笔多赚的CP，都说得明白。','基础货款、招牌加价和经营奖励分别列出。显示保留库存与小数累计，避免单价看不出提升、总价突然跳变。','试一试','查看经营奖励次数和出售后的库存。此例出售24只家常鸡宝，原价72，加价到账8，整筐12，总计92。','沿用优势','保留现有留一只和批量出售；页面美术沿用图鉴与商店，不另造一套交易界面。']];
function render(){document.querySelector('.switcher').innerHTML=tabs.map((t,i)=>`<button data-page="${i}" aria-pressed="${current===i}">${String(i+1).padStart(2,'0')} ${t}</button>`).join('');document.querySelector('.before').src='../../artifacts/round2-review/screens/'+before[current]+'.png';document.querySelector('.before').alt=tabs[current]+'当前游戏截图';document.querySelector('#phone').innerHTML=renderers[current]();const n=notes[current];document.querySelector('.notes').innerHTML=`<span class="index">0${current+1}</span><h2>${n[0]}</h2><p>${n[1]}</p><h3>${n[2]}</h3><p>${n[3]}</p><h3>${n[4]}</h3><p>${n[5]}</p><p class="stamp">方向评审稿<br>未修改正式游戏，数值以完整方案为准。</p>`}
function toast(t){const p=document.querySelector('#phone');p.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;p.append(el);setTimeout(()=>el.remove(),3500)}
function drawer(body){document.querySelector('#phone .overlay')?.remove();const el=document.createElement('div');el.className='overlay';el.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-label="详情"><button class="small-icon drawer-x" data-action="close" aria-label="关闭详情">×</button>${body}</section>`;document.querySelector('#phone').append(el);el.querySelector('button').focus();el.addEventListener('click',e=>{if(e.target===el)el.remove()})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined){current=+b.dataset.page;render();return}if(b.classList.contains('mobile-toggle')){document.body.classList.toggle('show-before');return}if(b.dataset.branch!==undefined){branch=+b.dataset.branch;render();return}if(b.dataset.plan){const s=skills.flat().find(x=>x[0]===b.dataset.plan);if(planned.has(s[0])){planned.delete(s[0]);points+=s[3]}else if(points>=s[3]){planned.add(s[0]);points-=s[3]}render();return}if(b.dataset.skill){const s=skills.flat().find(x=>x[0]===b.dataset.skill);drawer(`<span class="badge">${branches[branch]} · ${s[3]}点</span><h3>${s[1]}</h3><p>${s[2]}</p><div class="reward-box"><h3>何时生效</h3><p>${s[4]}</p></div><div class="fact"><i>✓</i><div>累计收取500只</div></div><div class="fact"><i>✓</i><div>已发现12种伙伴</div></div><p class="tiny-note">${s[5]==='尚未解锁'?'尚缺的厨房、发现或分支条件，以完整版手艺表为准。':'当前示例已满足这项手艺的条件。详细等级门槛见完整方案。'}</p><button class="primary" data-action="close">明白了</button>`);return}if(b.dataset.member!==undefined){drawer(`<span class="badge">选择同行伙伴</span><h3>谁适合这条小路？</h3><p class="tiny-note">以下为真实品种能力的示例；列表不自动替你出发。</p>${[[0,'鸡宝','采集4 · 发现2','在家8只 · 适应庭院','42% / 35%'],[4,'荷包蛋鸡','采集3 · 发现3','在家6只 · 适应庭院','39.5% / 37%']].map((x,i)=>`<button class="partner-choice" data-partner="${i}"><div class="art">${chick(x[0])}</div><div><b>${x[1]}　${x[2]}</b><p>${x[3]}</p><p>队伍材料 / 线索概率：${x[4]}</p></div></button>`).join('')}<p class="tiny-note">正式版还会显示增减箭头、筛选与上次队伍。</p>`);return}if(b.dataset.partner!==undefined){selectedPartner=+b.dataset.partner;render();toast('演示：收益预览随队伍更新');return}if(b.dataset.qty){qty=Math.max(1,Math.min(6,qty+Number(b.dataset.qty)));render();return}const a=b.dataset.action;if(a==='close'){b.closest('.overlay').remove();return}if(a==='observation'){current=3;render();return}if(a==='back-cook'){current=2;render();return}if(a==='points'){drawer('<h3>点数从哪里来？</h3><p>首次收取24只：2点<br>每发现5种：1点<br>每次厨房升级：2点<br>累计收取120、500、2,000、5,000只：各2点</p><div class="callout">当前内容最多54点。旧发现会计入，出售不会扣除已获得点数。</div>');return}if(a==='study'){drawer('<h3>解锁配方研读</h3><p>可花100 CP永久查看一个未知伙伴的全部获取方法。</p><div class="fact"><i>✓</i>累计收取240只</div><div class="fact"><i>✓</i>发现12种伙伴</div><div class="fact lock"><i>○</i>观察方向投入至少2点</div><p>需要3点学习；研读不会直接获得伙伴，也不会跳过出现条件。</p>');return}if(a==='fresh'){drawer('<h3>延长保鲜</h3><p>此例开启时：每枚破壳后保鲜2小时30分。关闭时按原规则保鲜30分钟。</p><p>只影响新开的一批。保温灯不会焦化；温泉蛋的10秒变化仍按原规则处理。</p>');return}if(a==='apply'){drawer(`<h3>应用这套手艺？</h3><p>本次学习${planned.size}项，花费${4-points}点。效果从相应生效时点开始。</p><p>这是界面演示，确认不会写入游戏存档。</p><button class="primary" data-action="applied">确认演示</button>`);return}if(a==='applied'){document.querySelector('#phone .overlay').remove();toast('演示：已应用方案。正式版会显示逐项结果。');return}if(a==='depart'){drawer('<h3>准备出发</h3><p>菜园围篱 · 2小时 · 免费<br>每种派出1只，到期自动回家。</p><div class="reward-box"><p>保证1份材料；可能额外带回1份材料、1条线索。提前召回将没有奖励。</p></div><button class="primary" data-action="demo-done">确认出发（演示）</button>');return}if(a==='deliver'){drawer(`<h3>交付${qty}只鸡宝？</h3><p>本次获得${qty*3} CP货款，交付后进度${qty+4}/12。全部交齐另得120 CP。</p><p>${qty===6?'家中将暂时没有鸡宝。':''}交付后不能取回。</p><button class="primary" data-action="demo-done">确认交付（演示）</button>`);return}if(['sell','cook'].includes(a)){drawer(`<h3>${a==='sell'?'确认出售':'开始调理'}</h3><p>此处展示提交前的最终操作。正式实现将校验最新余额、库存、手艺与条件，再保存整笔交易。</p><button class="primary" data-action="demo-done">确认演示</button>`);return}if(a==='demo-done'){document.querySelector('#phone .overlay').remove();toast('操作反馈演示 · 未修改游戏存档');return}const help={return:'正式版返回进入本页的厨房、农场或图鉴，并保留原位置。此处是独立界面样稿。',help:'设计演示：只展示布局、状态和信息层级。完整规则请阅读优化方案。',route:'另两条路线使用相同结构，显示各自时间、材料与解锁条件。',yard:'当前选中菜园围篱。',ingredients:'正式版在此打开已有材料选择组件，并保留当前草稿。',special:'正式版按需展开脏污、焦化和特殊变化条件，不把所有规则挤在主摘要。',known:'已知伙伴可看配方、出售类别和寻访能力。','team-help':'同队不能重复品种；至少1种、最多3种，每种派1只。基础材料不因人数少而减少。','sale-back':'正式版返回数量选择，保留已选数量和筛选。'};toast(help[a]||'这是布局演示，完整行为按方案实现。')});
document.addEventListener('change',e=>{if(e.target.matches('[data-fresh]')){fresh=e.target.checked;render()}if(e.target.matches('[data-bonus]')){useBonus=e.target.checked;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#phone .overlay')?.remove();const d=document.querySelector('#phone .drawer');if(e.key==='Tab'&&d){const f=[...d.querySelectorAll('button:not(:disabled),a,input')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();const board=new URLSearchParams(location.search).get('board');if(board){document.body.classList.add('board-mode');const ids=board==='2'?[3,4,5]:[0,1,2];document.querySelector('.board').innerHTML=`<div class="eyebrow">鸡宝厨房 · 第二轮 UI 方向稿</div><h1>${board==='2'?'让发现、采购和每笔收入都有来由。':'选择本领，带上伙伴，再开一锅。'}</h1><p class="sub">复用当前角色与厨具素材 · 390 × 844 设计视口 · 示意规则尚未接入游戏</p><div class="board-grid">${ids.map(i=>`<div><div class="phone">${renderers[i]()}</div><div class="caption">0${i+1}　${tabs[i]} / ${notes[i][0]}</div></div>`).join('')}</div>`}
</script></body></html>
